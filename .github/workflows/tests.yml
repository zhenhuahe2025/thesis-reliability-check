name: tests
on:
  pull_request:
  push:
    branches: ['feature/**', 'fix/**', 'refactor/**', 'docs/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TRC_REQUIRE_PDF_SANDBOX: '1'
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap libseccomp2
      - name: Allow Bubblewrap user namespaces in this CI job
        run: |
          sudo tee /etc/apparmor.d/trc-bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile trc-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/trc-bwrap
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
