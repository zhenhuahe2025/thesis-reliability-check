name: tests
on:
  pull_request:
  push:
    branches: ['feature/**', 'fix/**', 'refactor/**', 'docs/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRC_REQUIRE_PDF_SANDBOX: '1'
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap libseccomp2
      - run: python -m pip install -r requirements.txt
      - name: Diagnose Bubblewrap self-test
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import pdf_worker

          print("bubblewrap_version", subprocess.run(["bwrap", "--version"], capture_output=True, text=True).stdout.strip())
          print("parent_namespaces", pdf_worker._NAMESPACE_NAMES)
          parent = {name: str(os.stat("/proc/self/ns/" + name).st_ino) for name in pdf_worker._NAMESPACE_NAMES}
          with tempfile.TemporaryDirectory(prefix="trc-host-private-") as host_dir:
              marker = Path(host_dir) / "sentinel"
              marker.write_text("synthetic", encoding="ascii")
              probe = {
                  "TRC_PARENT_NAMESPACES": json.dumps(parent),
                  "TRC_HOST_MARKER": str(marker),
                  "TRC_HOST_WORKSPACE": str(Path.cwd().resolve()),
                  "TRC_HOST_HOME": str(Path.home().resolve()),
              }
              try:
                  command = pdf_worker._worker_command(probe=probe)
                  print("namespace_flags", [item for item in command if item.startswith("--unshare")])
                  command.append("--self-test")
                  result = subprocess.run(command, input=b"", stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                          cwd=tempfile.gettempdir(),
                                          env={"PATH": os.defpath, "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8"},
                                          timeout=5, check=False)
                  print("worker_exit", result.returncode)
                  print("worker_stdout", result.stdout.decode("utf-8", "replace")[:2500])
                  print("worker_stderr", result.stderr.decode("utf-8", "replace")[:2500])
              except Exception as error:
                  print("diagnostic_exception", repr(error))
          PY
      - run: python -m unittest -v
